name: AlnurIPTV
options:
  bundleIdPrefix: com.alnur
  deploymentTarget:
    iOS: "16.0"
targets:
  AlnurIPTV:
    type: application
    platform: iOS
    sources:
      - AlnurIPTV
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alnur.iptvplayer
        PRODUCT_NAME: AlnurIPTV
        MARKETING_VERSION: "1.5.1"
        CURRENT_PROJECT_VERSION: "18"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_BITCODE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
        SWIFT_OBJC_BRIDGING_HEADER: AlnurIPTV/AlnurIPTV-Bridging-Header.h
    info:
      path: AlnurIPTV/Info.plist
      properties:
        CFBundleDisplayName: Alnur IPTV
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarStyle: UIStatusBarStyleDefault
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Used to play IPTV streams.
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes:
          - audio
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        LSApplicationQueriesSchemes:
          - vlc-x-callback
          - vlc
